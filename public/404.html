<body><div><h1>404</h1><p>That page drifted away.</p><a id="home" href="./">Back to the start</a></div>
<script>
  // GitHub project pages live under /<repo>/, so work out the site root from the URL.
  var seg = location.pathname.split('/')[1];
  if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
  else document.getElementById('home').href = '/';
</script></body></html>
