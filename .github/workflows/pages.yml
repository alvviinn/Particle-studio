name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp local CSS/JS links and module imports with the commit, so browsers
      # fetch fresh files after every deploy instead of running a cached mix.
      - name: Cache-bust assets
        run: |
          V="${GITHUB_SHA::7}"
          sed -E -i "s#(['\"])(\./[A-Za-z0-9_-]+\.js)\1#\1\2?v=$V\1#g" public/js/*.js
          sed -E -i "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=$V\"#g" public/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
